{% extends "base.html" %}{% block body %}
<form method="post" class="card"><h3>Settings</h3>
<label class="f">After a pause or sleep gap<select name="resume_policy">
{% for v, t in [('catch_up', 'Catch up: spread overdue steps over the next hour'), ('push', 'Shift forward: move remaining steps by the gap'), ('skip_stale', 'Skip stale notes, then shift')] %}<option value="{{ v }}" {{ 'selected' if policy == v }}>{{ t }}</option>{% endfor %}</select></label>
<label class="tog"><input type="checkbox" name="login" value="on" {{ 'checked' if login }}> Start at login (does not wake a sleeping machine)</label>
<div class="row"><span></span><button class="primary">Save</button></div></form>{% endblock %}
