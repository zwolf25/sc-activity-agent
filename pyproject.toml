[project]
name = "sc-activity-agent"
dynamic = ["version"]
description = "Generates realistic ServiceChannel work order, proposal and invoice activity through the public API."
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "certifi", "truststore>=0.9", "fastapi>=0.110", "jinja2>=3.1", "uvicorn>=0.29", "python-multipart>=0.0.9", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2"]

[project.scripts]
agent = "sc_activity_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "sc_activity_agent.__version__"}

[tool.setuptools.packages.find]
include = ["sc_activity_agent*"]

[tool.setuptools.package-data]
"sc_activity_agent.web" = ["static/*", "templates/*"]   # without this a pip install has no console pages
"sc_activity_agent.photos" = ["*.jpg", "manifest.json"]   # the before/after photo library

[tool.pytest.ini_options]
testpaths = ["tests"]
