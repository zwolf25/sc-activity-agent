name: Desktop build check
# Proves the desktop app still builds on both platforms, without signing or publishing anything.
on:
  workflow_dispatch:
  pull_request:
    paths: ["src-tauri/**", "packaging/**", "desktop/**", "package.json", ".github/workflows/desktop-check.yml"]
  push:
    branches: [main]
    paths: ["src-tauri/**", "packaging/**", "desktop/**", "package.json", ".github/workflows/desktop-check.yml"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install . pyinstaller tzdata
      - run: sh packaging/build_sidecar.sh
        shell: bash
      - run: npm install
      - run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash
